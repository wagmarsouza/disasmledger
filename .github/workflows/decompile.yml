name: Decompile 3.0 qualification

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: decompile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualification:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - name: Install runner-only test dependencies
        run: python -m pip install PyYAML==6.0.3 -r skills/decompile/requirements-verified.txt
      - name: Record dependency versions
        run: python -m pip freeze
      - name: Decompile regression suite
        run: python -B -m unittest discover -s skills/decompile/tests -v
      - name: Renode Bench preserved suite
        run: python -B -m unittest discover -s skills/renode-bench/tests -v
      - name: Binary Analysis Profile preserved suite
        run: python -B -m unittest discover -s skills/binary-analysis-profile/tests -v
      - name: Read pinned optional coordinator sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: wagmarsouza/long-project-agent-harness
          ref: cc7343c1a2ed9961ed8d3840e1b9edcdba6afd90
          path: _coordinator
          persist-credentials: false
      - name: Live measurement integration pilot
        run: python -B skills/decompile/examples/run_measurement_pilot.py --harness _coordinator/harnesses/v8.4/scripts/harness.py
      - name: Generic target qualification integration pilot
        run: python -B skills/decompile/examples/run_qualification_pilot.py --harness _coordinator/harnesses/v8.4/scripts/harness.py
      - name: Real native GCC and process-image pilot
        if: runner.os == 'Linux'
        run: python -B skills/decompile/examples/run_measurement_pilot.py --harness _coordinator/harnesses/v8.4/scripts/harness.py --compiler /usr/bin/gcc
      - name: Generic gates with actual native GCC
        if: runner.os == 'Linux'
        run: python -B skills/decompile/examples/run_qualification_pilot.py --harness _coordinator/harnesses/v8.4/scripts/harness.py --compiler /usr/bin/gcc

  required:
    name: Decompile qualification required
    if: always()
    needs: qualification
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse failed, cancelled or skipped qualification
        env:
          QUALIFICATION_RESULT: ${{ needs.qualification.result }}
        run: test "$QUALIFICATION_RESULT" = success
